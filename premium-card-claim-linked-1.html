n class=\"section statement\" id=\"about\"><div class=\"reveal\"><div class=\"eyebrow\">MY APPROACH</div><div class=\"big-number\">01</div><h2>가입한 보험부터<br/>차근차근 살펴봅니다.</h2><p class=\"intro\">보험은 가입한 상품의 이름보다 실제 어떤 상황에서 어떤 보장을 받을 수 있는지 이해하는 것이 중요합니다. 현재 계약의 보장과 보험료를 살펴보고, 상담이 필요한 부분을 함께 확인합니다.</p><div class=\"services\"><div class=\"service\"><b>01</b><div><strong>보장 내용 확인</strong><p>암·뇌·심장·수술·간병 등 주요 담보 확인</p></div></div><div class=\"service\"><b>02</b><div><strong>보험료 및 납입기간 점검</strong><p>현재 가입 계약의 주요 조건 정리</p></div></div><div class=\"service\"><b>03</b><div><strong>상담 방향 안내</strong><p>유지·정리·보완 필요성 검토</p></div></div></div></div></section>\n<section class=\"section action-section\" id=\"coverage\"><div class=\"reveal\"><div class=\"eyebrow\">COVERAGE REVIEW</div><div class=\"action-num\">02</div><h2>내 보험,<br/>어떤 보장을 받고 있을까요?</h2><p class=\"intro\">가입한 보험의 보장 내용이 궁금하다면 무료 보장분석 상담을 신청해 주세요.</p><div class=\"action-card\"><h3>무료 보장분석 문의</h3><p>현재 보험의 주요 보장, 중복 및 부족할 수 있는 보장 등을 상담을 통해 함께 살펴봅니다.</p><a class=\"cta\" href=\"https://imoonincar-glitch.github.io/insurance/\" rel=\"noopener\" target=\"_blank\"><span>보장분석 상담 신청하기</span><span>↗</span></a><p class=\"note\">분석 내용은 실제 계약과 제공 자료에 따라 달라질 수 있습니다.</p></div></div></section>\n<section class=\"section action-section claim\" id=\"claim\"><div class=\"reveal\"><div class=\"eyebrow\">CLAIM GUIDANCE</div><div class=\"action-num\">03</div><h2>보험금 청구,<br/>어디서부터 시작할까요?</h2><p class=\"intro\">보험금 청구 절차나 준비 서류가 궁금할 때, 상담 문의를 남겨 주세요.</p><div class=\"action-card\"><h3>보험금 청구 문의</h3><p>청구 유형과 문의 내용을 바탕으로 상담을 진행합니다. 이 신청은 보험금 청구의 공식 접수가 아닙니다.</p><a class=\"cta\" href=\"https://imoonincar-glitch.github.io/insurance/claim-inquiry.html\" rel=\"noopener\" target=\"_blank\"><span>보험금 청구 상담 문의하기</span><span>↗</span></a><p class=\"note\">보험금 청구 상담 신청 페이지로 이동합니다. 주민등록번호, 진단서 등 민감한 정보는 문의란에 입력하지 마세요.</p></div></div></section>\n<section class=\"section social\" id=\"social\"><div class=\"reveal\"><div class=\"eyebrow\">STAY CONNECTED</div><h2>보험에 관한 이야기,<br/>조금 더 가까이.</h2><p class=\"intro\">일상에서 알아두면 도움이 되는 보험 정보와 소식을 인스타그램에서 전합니다.</p><a class=\"cta\" href=\"https://www.instagram.com/moon_incar\" rel=\"noopener\" target=\"_blank\"><span>인스타그램 방문하기 · @moon_incar</span><span>↗</span></a><div class=\"signature\"><div><strong>문상미 <span style=\"font-size:13px;font-weight:400\">팀장</span></strong><br/><small>인카금융서비스(주) 다이렉트</small></div><span class=\"monogram\">M.</span></div></div></section><footer class=\"footer\">본 페이지는 보험 관련 상담 안내를 위한 개인 전자명함입니다. 보험 가입 및 보험금 지급 여부는 개별 상품의 약관과 심사 기준 등에 따라 달라질 수 있습니다.</footer></main>";
